; SKSE-Bridge legacy plugin host. Place next to SKSE-Bridge.dll in Data\SKSE\Plugins.
[General]
; 1 = inspect and log every legacy DLL, load nothing.
dry_run=0
; Folder holding the unmodified legacy DLLs. SKSE itself must not load them.
legacy_dir=Data\SKSE\Plugins\Legacy
; * = every .dll in legacy_dir, or a comma-separated list of file names.
plugins=*

[Translate]
; 0 = Stage 1 only: plain LoadLibrary + SKSEPlugin_Load, nothing adapted (negative control).
enabled=1
; Runtime assumed for legacy CommonLibSSE-NG plugins that do not say which runtime they were built for.
; Its Address Library file must be installed (the All in One package has 1.6.640 and 1.6.1170).
; Plugins built for the running game load natively; per-plugin overrides go in [Targets].
legacy_runtime=1.6.1170.0
; Also present legacy_runtime in the SKSE interface handed to the plugin.
spoof_skse_runtime=1
; Answer the shared ID-table lookup with a table built from the installed Address Library.
id_table=1
; Empty = Data\SKSE\Plugins\versionlib-<game version>.bin
address_library=
; Also remap IDs a game update renumbered by inferring them from the two Address Libraries (beyond the
; verified list). Off: measured on 1.6.1170 -> 1.7.104, some inferred pairs point at an unrelated function.
infer_renumbered=0
; 1 = load even when prerequisites are missing. Expect fatal dialogs from the plugin.
force=0

[Diagnostics]
; Check resolved offsets against the running SkyrimSE.exe (image range, .pdata function starts).
verify_ids=1
; Scan each legacy DLL's RTTI for classes whose game base class gained virtual functions in 1.7.99.
rtti_scan=1
; Log first-chance exceptions that involve a hosted plugin (log only; never handles them).
fault_log=1
; Log every write a hosted plugin makes into SkyrimSE.exe code or vtables ([patch] lines), judged against
; both Address Libraries: function start / unchanged function / changed function / vtable slot.
patch_audit=1

[Compatibility]
; Deliver every SKSE message to every hosted plugin. Without it SKSE delivers only to the first hosted
; plugin that registered (they share the bridge's plugin handle), so the others never see kDataLoaded etc.
messaging_fanout=1
; Refuse a hosted plugin's write into SkyrimSE.exe when it would land on the wrong code: an in-function patch
; (ID + offset taken from 1.6.1170 code) inside a function whose size changed, where the bytes are not the
; call/jump the hook expects, or a vtable slot that moved in 1.7.99. The plugin feature behind that patch is
; then missing instead of corrupting game code. Every refusal is logged. Needs patch_audit=1.
patch_guard=1
; Allow-list per plugin: Legacy\compat\<plugin>.patches, one "allow <ID>+0x<offset>" line per site you have
; checked yourself. Such writes are never refused.

; Show each hosted DLL its normal location, Data\SKSE\Plugins\<name>.dll, instead of Legacy\<name>.dll, so
; plugins that find their ini / data folder next to their own DLL use the files your mod manager installed.
; Opening that path for the DLL itself (version info, LoadLibrary, CreateFile...) is mapped back to Legacy\.
present_plugin_path=1
; Give every hosted plugin its own sub-space in the SKSE co-save (the bridge saves under 'SKBR').
; 0 = old behaviour: all hosted plugins share one co-save slot and only the last one registered saves.
; Switching either way: co-save data saved the other way is not read (see README).
cosave_multiplex=1

[Targets]
; Per-plugin override: <file>.dll = <runtime it was built for> | native
; Without an entry: a version list in the DLL's SKSEPlugin_Version decides; otherwise legacy CommonLibSSE-NG
; plugins get legacy_runtime; any other kind loads natively (it reads the Address Library itself).
; Example:
; SomeOld640Plugin.dll=1.6.640
; SomeModernPlugin.dll=native

[VMShadow]
; EXPERIMENTAL per-plugin fixes for plugins built for another Skyrim version. Detected automatically:
;  - shadow Papyrus VM: 1.7.99 moved every SkyrimVM member from 0x180 on by 0x10 (VM pointer 0x200 on 1.6, 0x210 on 1.7).
;    The plugin's SkyrimVM singleton points at a bridge-owned copy whose accesses go to the real object's offsets.
;  - shadow player: 1.7.99 added a sink to PlayerCharacter at 0x2D8 (every member from there on moved by 8). Without it,
;    registering BGSActorCellEvent / BGSActorDeathEvent / PositionPlayerEvent sinks on the player can hang or crash.
;  - present version: the plugin carries a list of supported game versions that excludes this game; the SKSE interface
;    reports one of its versions to that plugin only. Its structure layouts stay those of its own build.
; enabled=0 turns all of this off.
enabled=1
; On first launch with such a plugin: ONE Yes/No question per plugin for all fixes it needs. The answer is saved in
; Data\SKSE\Plugins\SKSE-Bridge\ShadowVM\<plugin>.dll.json (under MO2: in Overwrite, or move it into a mod) and
; never asked again, unless the DLL changes. Edit the file to change one fix:
;   "shadow_vm": true/false, "shadow_player": true/false, "present_version": "1.7.104.0" or false.
; Delete the file to be asked again. 0 = never ask (undecided fixes stay off).
ask_on_startup=1
; Per-plugin lines from older versions ([VMShadow] / [PlayerShadow] / [PresentVersion] <dll>=...) are copied into
; the JSON once and then ignored; they can be removed.

[Trace]
; TEST-ONLY. Honoured only by a DLL built with `xmake f --trace=y` (see docs/TRACE.md); the release DLL ignores this section.
; 1 = write SKSE-Bridge-trace.jsonl (+ per-plugin table CSVs) next to SKSE-Bridge.log, for tools/trace_viz.py and tools/trace_replay.html.
enabled=0
; 1 = record every read a hosted plugin makes in its Address Library table (which ID, when, which plugin).
; Implemented with guard pages, so it slows plugin start-up (seconds, not minutes). 0 = lifecycle/table/patch/fault events only.
lookups=1
; 1 = also record every write a plugin makes into the game exe ([patch] lines) as events.
patches=1
; 1 = record the "flows" for the graph view: shadow SkyrimVM / PlayerCharacter redirects, plugin messaging (fan-out, plugin-to-plugin, plugin-to-SKSE)
; and co-save traffic. Cheap: counters are batched on a writer thread, the exception handler does no extra work.
flows=1
; Per-plugin CSV of how every legacy ID was translated: 0 = none, 1 = only IDs that are not a plain 1:1 (missing / remapped), 2 = every ID (~17 MB per plugin).
table_dump=1
