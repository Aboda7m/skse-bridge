; SKSE-Bridge legacy plugin host. Place next to SKSE-Bridge.dll in Data\SKSE\Plugins.
[General]
; 1 = inspect and log every legacy DLL, load nothing.
dry_run=0
; Folder holding the unmodified legacy DLLs. SKSE itself must not load them.
legacy_dir=Data\SKSE\Plugins\Legacy
; * = every .dll in legacy_dir, or a comma-separated list of file names.
plugins=*

[Translate]
; 0 = Stage 1 only: plain LoadLibrary + SKSEPlugin_Load, nothing adapted (negative control).
enabled=1
; Runtime the legacy plugins were built for. Its Address Library file must be installed too.
legacy_runtime=1.6.1170.0
; Also present legacy_runtime in the SKSE interface handed to the plugin.
spoof_skse_runtime=1
; Answer the shared ID-table lookup with a table built from the installed Address Library.
id_table=1
; Empty = Data\SKSE\Plugins\versionlib-<game version>.bin
address_library=
; 1 = load even when prerequisites are missing. Expect fatal dialogs from the plugin.
force=0

[Diagnostics]
; Check resolved offsets against the running SkyrimSE.exe (image range, .pdata function starts).
verify_ids=1
; Scan each legacy DLL's RTTI for classes whose game base class gained virtual functions in 1.7.99.
rtti_scan=1
; Log first-chance exceptions that involve a hosted plugin (log only; never handles them).
fault_log=1
